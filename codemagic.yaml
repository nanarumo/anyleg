# Cloud iOS build (no Mac needed). Push this folder to GitHub, connect the repo in Codemagic,
# add an App Store Connect API key integration named "anyleg-asc", then run this workflow.
workflows:
  ios-release:
    name: Anyleg iOS
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: anyleg-asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anyleg.app
    scripts:
      - npm ci
      - npm run ios
      - xcode-project use-profiles --project ios/App/App.xcodeproj
      # Every upload needs a new build number; Codemagic's run counter keeps it increasing.
      - cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
